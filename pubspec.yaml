name: futurepath_employment_hub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1

  cupertino_icons: ^1.0.8

  # Session management and local storage
  shared_preferences: ^2.3.3

  # File picker for CV uploads
  file_picker: ^8.1.4

  # Connects your mobile app to your real database server
  supabase_flutter: ^2.8.0

  # Safely reads secret keys from the local root .env configuration file
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env